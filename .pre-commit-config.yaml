# Formats staged C++ sources with clang-format (style: .clang-format).
#   pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]
        exclude: ^external/
