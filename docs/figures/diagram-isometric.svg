<text x="676.0" y="36.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">Each triangle is a rigid body</text>
<text x="676.0" y="54.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">(its angles and area stay its 3D ones, at the chart's scale)</text>
<line x1="676.00" y1="92.00" x2="706.00" y2="92.00" stroke="#ff7b72" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arr-ff7b72)"/>
<text x="716.0" y="96.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">Vertex ↔ vertex spring</text>
<text x="716.0" y="113.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">corners that were one atlas vertex are pulled</text>
<text x="716.0" y="128.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">together (weak while overlaps are pushed apart)</text>
<line x1="676.00" y1="154.00" x2="706.00" y2="154.00" stroke="#a371f7" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arr-a371f7)"/>
<text x="716.0" y="158.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">Repulsion impulse</text>
<text x="716.0" y="175.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">an overlapping pair (shaded) is pushed apart,</text>
<text x="716.0" y="190.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">∓j n at the centroid of their overlap</text>
<line x1="676.00" y1="216.00" x2="706.00" y2="216.00" stroke="#4493f8" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arr-4493f8)"/>
<text x="716.0" y="220.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">Velocity</text>
<text x="716.0" y="237.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">forces and impulses change each body's</text>
<text x="716.0" y="252.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">velocity, which carries over between steps</text>
<line x1="676.00" y1="278.00" x2="706.00" y2="278.00" stroke="#3fb950" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arr-3fb950)"/>
<text x="716.0" y="282.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">Spin</text>
<text x="716.0" y="299.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">torques turn each triangle about its centroid;</text>
<text x="716.0" y="314.0" font-size="12.0" fill="#9198a1" text-anchor="start" font-weight="400">its shape and size never change</text></svg>
